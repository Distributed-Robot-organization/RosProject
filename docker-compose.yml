version: "3.8"

services:
  ros_docker:
    image: dist_docker
    container_name: ros_docker
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../../:/home/computer
    network_mode: host
    privileged: true
    working_dir: /home/computer
    stdin_open: true # -i flag
    tty: true # -t flag
    restart: "no" # --rm equivalent is manual removal, docker-compose doesn’t auto-remove containers
