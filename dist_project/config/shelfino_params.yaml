#     # If vect_* are empty lists or not defined, then only random victims will be spawned

/**:
  ros__parameters:
    use_sim_time: true
    world_frame: "map"
    # map: "plane_2" # Maps can be "test_world" or "plane_2"
    # init_names: ["shelfino1", "pollo"] # Names of the robots to be spawned
    # init_rand: [false, false] # If true, the robots will be spawned in random positions
    # init_x: [9.3, 14.24] # X position of the robots
    # init_y: [1.2, 5.56] # Y position of the robots
    # init_yaw: [0.65, -2.37] # Yaw of the robots

    # init_names: ["shelfino1"] # Names of the robots to be spawned
    # init_rand: [false] # If true, the robots will be spawned in random positions
    # init_x: [5.0] # X position of the robots
    # init_y: [4.5] # Y position of the robots
    # init_yaw: [0.0] # Yaw of the robots

    map: "big_map" # Maps can be "test_world" or "plane_2"
    init_names: ["shelfino1","pollo"] # Names of the robots to be spawned
    init_rand: [false, false] # If true, the robots will be spawned in random positions
    init_x: [-6.515889,-16.018056] # X position of the robots
    init_y: [-21.358118,-10.088077] # Y position of the robots
    init_yaw: [0.434410,-1.603014] # Yaw of the robots

    server:
      voxel_size: 0.05 #meters
      hz: 1 #update rate of the cluster
      minimum_percentage: 0.1 # ... of the maximum detected to be considered when we are finding the voxels to analyze again
      voxel_estimate: "voxel_estimate_out"
      maximum_count_per_voxel: 2
      pcl_topic_in: "cluster_pcl"
      minimum_distance: 2.0
      radius_multiplier: 2.0 #TODO: confrontarci

    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: transient_local
          history: keep_last
          reliability: reliable

    checkpoints:
      pollo: [-5.4,18.0,-1.53, 10.0,21.0,1.69]
      shelfino1: [3.8,-11.7,-1.7, -12.1,-16.86,1.69, -24.0,0.5,1.68, 1.0,1.34,-1.57]

    topics:
      filtered_pcl: "filtered_pcl"
      raw_pcl: "f_camera/points"
      cluster_pose: "c_position"
      cluster_pcl: "cluster_pcl"
      poses_to_be_in: "poses"
      cluster_centroid: "median" # "median" and "centroid"  are usable values
    
    robot_logic:
      vision_manager: "lifecycled_pcl"
      vision_activation_distance: 5.0
      vision_activation_check_hz: 0.5

    pcl_filter_params:
      cluster_tolerance: .05
      plane_distance_treshold: 0.06
      noise_mean: .0
      noise_dev: .03

    shelfino_additions:
      max_camera_depth: 8.0
