name: Build and Compile ROS2 workspace
#add git actions
on:
  push:
    branches: [ test/CI]
  pull_request:
    branches: [ test/CI ]

jobs:
  ROS_CI:
    runs-on: ubuntu-latest
    strategy: 
      fail-fast: false
      matrix:
        ros2_distribution:
          - humble

        include: 
          - docker_image: osrf/ros:humble-desktop-full
            ros_distribution: humble
            ros_version: 2
    
    container:
        image: ${{ matrix.docker_image }}
    
    steps:
      - name: Setup workspace
        run: mkdir -p ros_ws/src

      - name: Install system dependencies
        run: |
          apt-get update && \
          apt-get install -y \
          python3-pip \
          python3-colcon-common-extensions \
          nano \
          sudo \
          libpcl-dev \
          ros-humble-slam-toolbox \
          ros-humble-teleop-twist-joy \
          ros-humble-teleop-twist-keyboard \
          ros-humble-twist-mux \
          ros-humble-joint-state-publisher-gui \
          ros-humble-xacro \
          ros-humble-navigation2 \
          ros-humble-nav2-bringup \
          ros-humble-gazebo-* \
          ros-humble-ros-gz* \
          ros-humble-gazebo-ros-pkgs \
          ros-humble-ros2-control \
          ros-humble-robot-state-publisher \
          ros-humble-gazebo-ros2-control \
          ros-humble-ros2-controllers \
          ros-humble-rtabmap-*\
          ros-humble-pcl-*\
          python3-shapely\
          libcpl-dev\
          gdb\
          ros-humble-topic-tools && \
          rm -rf /var/lib/apt/lists/*

      - name: Install Python packages
        run: |
          pip3 install pyserial flask flask-ask-sdk ask-sdk xmlschema pyyaml shapely notebook ultralytics open3d torch torchvision pyyaml

      - name: Checkout code and setup workspace
        uses: actions/checkout@v4
        with:
          path: ros_ws/src
          submodules: 'recursive'
          token: ${{ secrets.GH_TOKEN }}

      - name: Update submodules
        run: |
          cd ros_ws/src
          git submodule update --init --recursive

      - name: Setup git credentials
        run: |
          git config --global url."https://${{ secrets.GH_TOKEN }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"

      - name: Setup ROS environment
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distribution }}
      
      - name: Initialize rosdep
        run: |
          apt-get update && apt-get install -y python3-rosdep
          rosdep init || true
          rosdep update
          
      - name: Build packages
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distribution }}/setup.bash
          cd ros_ws
          colcon build --packages-select \
            obstacles_msgs \
            interfaces_pkg \
            shelfino_description \
            shelfino_gazebo \
            shelfino_navigation \
            vision_system \
            navigation_system \
            main_logic \
            coordination \
            planning_pkg \
            projects \
            --symlink-install --parallel-workers 1 && source install/setup.bash
